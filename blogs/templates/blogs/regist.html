
  <form method="POST" action="{% url 'blogs:register' %}" >
    {% csrf_token %}
    <table>
      <tr><td>登录帐号：</td>
        <td>
          <input type="text" name="account" id="account" placeholder="请输入登录帐号" required="required" />
        </td>
      </tr>
      <tr><td>登录密码：</td>
        <td>
          <input type="[assword" name="pwd1" id="pwd1" placeholder="请输入登录密码" required="required" />
        </td>
      </tr>
      <tr><td>确认密码：</td>
        <td>
          <input type="password" name="pwd2" id="pwd2" placeholder="请确认密码" required="required" />
        </td>
      </tr>
      <tr><td>用户名：</td>
        <td>
        <input type="text" name="name" id="name" placeholder="请输入姓名" required="required" />
        </td>
      </tr>
      <tr><td>年级班级：</td>
        <td>
        <input type="text" name="gradeclass"  placeholder="请输入年级班级" required="required" />
        </td>
      </tr>
      <tr>
        <td colspan="2" style="text-align:center;"><input type="submit" value="注册" /></td>
      </tr>
    </table>
    {% if msg % }
      <span> {{ msg }} </span>
    {% endif %}
  </form>
