{% extends "blogs/base.html" %}

{% block content %}

  <p>
    <a href="{% url 'blogs:blogpost' blogpost.id %}">{{ blogpost }}</a>
  </p>
  <p>编辑评论:</p>

  <form action="{% url 'blogs:edit_comment' comment.id %}" method='post'>

  </form>

{% endblock content %}
